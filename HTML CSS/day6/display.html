<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        p{
            color: crimson;
            font-size: 30px;
        }
       
        p.ex1{

            display: none;
        }

        p.ex2{
            display: block;
            background-color: aqua;
        }

        p.ex3{
            display: inline;
            background-color: rgb(220, 65, 207);
        }

    </style>
</head>
<body>

    <h1> Display :None</h1>
    <div>
        Here Display none means nothing to Display

        <p class="ex1">Hello Display None</p>
    </div>




    <h1> Display : Block</h1>
    <div>
        Here Display Block means - Blockl level Element -v 100% width of space

        <p class="ex2">Hello Display Block</p>
    </div>

    
    <h1> Display : inline</h1>
    <div>
        Here Display inline means like span - Required amount of width
        

        <p class="ex3">Hello Display inline</p>
    </div>
</body>
</html>
