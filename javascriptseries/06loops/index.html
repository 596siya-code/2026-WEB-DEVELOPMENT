    <script>
    //loop : repeating task again and again 
    //golden rule ; when condition is true loop starts ,when condition is false loop stops

    //1. for(start point; ending /condition; operators- ++/ --)loop
    //starting point and eending point use for (FOR LOOP)
    //task- print numbers 1to 10 in console

    for (let i=1;  i<=10 ; i++) {
        //task
        console.log("the value is" ,i)//1 time written
        
    }

    //print 10 to 1
     for (let j=1;  j<=10 ; j++) {
        //task
        console.log("the value is" ,j)//1 time written
        
    }
   
    //while(condition) loop

    let count =1

    while(count<=5){
        console.log("Good Evening")
        count++; 
    }

    //Do while loop : it will execute/run the code atleast for 1 time
    let number =7
    do{
        console.log("hello guys")
    }
    while(number<5)





    </script>
