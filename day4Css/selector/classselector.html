<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .abc{
            color: crimson;
            background-color: aquamarine;
        }

        .xyz{
            color: blueviolet;
            background-color: antiquewhite;
            
        }
    </style>
</head>
<body>

    <!-- different tags -same style- use class .className -->
     

    <h2 class="abc">Hello heading</h2>

    <h2 class="xyz">hello heading 2</h2>

    <p class="abc"> this is paragraph</p>

    <button class="abc">click me</button>

    <div class="xyz">
        Hello div
    </div>
</body>
</html>
